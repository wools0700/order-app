<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>주문 목록</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main>
        <h1>주문 목록</h1>
        <form method="get" action="/" class="search-bar">
            <input name="order_no" value="{{SEARCH_TERM}}" placeholder="주문번호를 입력해주세요." aria-label="주문번호">
            <button type="submit" class="primary-button">검색</button>
            <a href="/" class="secondary-button">전체보기</a>
            <button type="button" class="refresh-button" aria-label="새로고침" title="새로고침" onclick="window.location.reload()">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
                    <path d="M20 4v4h-4"></path>
                </svg>
            </button>
        </form>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>주문번호</th>
                        <th>주문자</th>
                        <th>상품명</th>
                        <th>수량</th>
                        <th>단가(원)</th>
                        <th>금액(원)</th>
                        <th>주문 상태</th>
                    </tr>
                </thead>
                <tbody>{{TABLE_BODY}}</tbody>
            </table>
        </div>
    </main>
</body>
</html>
